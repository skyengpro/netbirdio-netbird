name: Sync upstream

on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Fast-forward main and mirror tags from upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/netbirdio/netbird.git
          git fetch upstream main --tags --prune --force
          git checkout main
          # --ff-only: fail instead of overwriting a fork-local commit, so a
          # diverged fork is surfaced rather than silently reset.
          git merge --ff-only upstream/main
          git push origin main
          git push origin --tags
